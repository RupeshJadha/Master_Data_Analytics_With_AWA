        stage: "[Custom]"
        authentication: "Credentials"
        s3ObjectPrefix: "s3://rjanalytics/ACCOUNT/account_new.csv"
        pattern: ".*"
        encryption: "S3 Encryption"
        warehouse: "DEMO_WAREHOUSE"
        database: "DEMO_DATABASE"
        schema: "DEMO_SCHEMA"
        targetTable: "ACCOUNT"
        loadColumns:
